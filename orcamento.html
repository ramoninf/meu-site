<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="3975.png">
<title>Simulador de Orçamento - RAMONINFTEC</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C2RRG5QLRV"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-C2RRG5QLRV');
</script>
<!-- Google Fonts: Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- FontAwesome para Ícones -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --accent-color: #22c55e;
        --accent-hover: #16a34a;
        --dark-bg: #0f172a;
        --light-bg: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --text-muted: #64748b;
        --border-radius: 16px;
        --box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: var(--light-bg);
        color: var(--text-color);
        line-height: 1.6;
        padding: 40px 20px;
    }

    .budget-container {
        max-width: 800px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 40px;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .budget-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .budget-header h1 {
        font-size: 2.2rem;
        color: var(--dark-bg);
        margin-bottom: 10px;
        font-weight: 700;
    }

    .budget-header h1 span {
        color: var(--primary-color);
    }

    .budget-header p {
        color: var(--text-muted);
        font-size: 1rem;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-color);
        font-size: 0.95rem;
    }

    .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1rem;
        color: var(--text-color);
        background: #fff;
        transition: var(--transition);
        outline: none;
    }

    .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Grelha de Opções de Serviços */
    .services-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
        margin-top: 10px;
    }

    .service-card-checkbox {
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #fff;
        position: relative;
    }

    .service-card-checkbox:hover {
        border-color: var(--primary-color);
        transform: translateY(-2px);
    }

    .service-card-checkbox input[type="checkbox"] {
        position: absolute;
        top: 16px;
        right: 16px;
        accent-color: var(--primary-color);
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .service-card-checkbox.selected {
        border-color: var(--primary-color);
        background: rgba(37, 99, 235, 0.03);
    }

    .service-title {
        font-weight: 600;
        font-size: 1rem;
        color: var(--text-color);
    }

    .service-price {
        font-size: 0.85rem;
        color: var(--primary-color);
        font-weight: 500;
    }

    /* Caixa de Resumo e Total */
    .budget-summary {
        background: #f1f5f9;
        padding: 20px 24px;
        border-radius: 12px;
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        border-left: 5px solid var(--primary-color);
    }

    .summary-text h3 {
        font-size: 1.1rem;
        color: var(--dark-bg);
        margin-bottom: 4px;
    }

    .summary-text p {
        font-size: 0.85rem;
        color: var(--text-muted);
    }

    .total-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary-color);
    }

    /* Botão de Envio */
    .btn-submit {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        background: var(--accent-color);
        color: white;
        padding: 16px;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 25px;
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        text-decoration: none;
    }

    .btn-submit:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
    }

    .back-link {
        display: inline-block;
        margin-top: 20px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        transition: var(--transition);
    }

    .back-link:hover {
        color: var(--primary-color);
    }

    @media (max-width: 600px) {
        .budget-container {
            padding: 20px;
        }
        .budget-header h1 {
            font-size: 1.8rem;
        }
    }
</style>
</head>
<body>

<div class="budget-container">
    <div class="budget-header">
        <h1>RAMON<span>INFTEC</span></h1>
        <p>Monte o seu orçamento personalizado e envie diretamente para o nosso WhatsApp</p>
    </div>

    <form id="budgetForm">
        <!-- Dados do Cliente -->
        <div class="form-group">
            <label for="clientName"><i class="fas fa-user">*</i> O seu Nome:</label>
            <input type="text" id="clientName" class="form-control" placeholder="Digite o seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="serviceCategory"><i class="fas fa-list"></i> Categoria de Serviço:</label>
            <select id="serviceCategory" class="form-control" onchange="toggleCategory()">
                <option value="manutencao">Manutenção de Hardware / Computadores</option>
                <option value="web">Desenvolvimento Web / Programação</option>
            </select>
        </div>

        <!-- Opções de Manutenção -->
        <div class="form-group" id="groupManutencao">
            <label><i class="fas fa-tools"></i> Selecione os serviços de Manutenção:</label>
            <div class="services-grid">
                <label class="service-card-checkbox" onclick="calcTotal()">
                    <input type="checkbox" name="servico" value="Limpeza Preventiva" data-price="80">
                    <span class="service-title">Limpeza Preventiva</span>
                    <span class="service-price">Aprox. R$ 80,00</span>
                </label>
                <label class="service-card-checkbox" onclick="calcTotal()">
                    <input type="checkbox" name="servico" value="Upgrade de SSD" data-price="150">
                    <span class="service-title">Upgrade de SSD</span>
                    <span class="service-price">Aprox. R$ 150,00</span>
                </label>
                <label class="service-card-checkbox" onclick="calcTotal()">
                    <input type="checkbox" name="servico" value="Expansão de Memória RAM" data-price="100">
                    <span class="service-title">Expansão de Memória RAM</span>
                    <span class="service-price">Aprox. R$ 100,00</span>
                </label>
                <label class="service-card-checkbox" onclick="calcTotal()">
                    <input type="checkbox" name="servico" value="Remoção de Vírus e Otimização" data-price="90">
                    <span class="service-title">Remoção de Vírus / Otimização</span>
                    <span class="service-price">Aprox. R$ 90,00</span>
                </label>
            </div>
        </div>

        <!-- Opções de Web -->
        <div class="form-group" id="groupWeb" style="display: none;">
            <label><i class="fas fa-code"></i> Selecione o Projeto Web:</label>
            <div class="services-grid">
                <label class="service-card-checkbox" onclick="calcTotal()">
                    <input type="checkbox" name="servico" value="Landing Page Responsiva" data-price="450">
                    <span class="service-title">Landing Page</span>
                    <span class="service-price">Aprox. R$ 450,00</span>
                </label>
                <label class="service-card-checkbox" onclick="calcTotal()">
                    <input type="checkbox" name="servico" value="Site Institucional Completo" data-price="900">
                    <span class="service-title">Site Institucional</span>
                    <span class="service-price">Aprox. R$ 900,00</span>
                </label>
                <label class="service-card-checkbox" onclick="calcTotal()">
                    <input type="checkbox" name="servico" value="Sistema Web Customizado (PHP/MySQL)" data-price="1500">
                    <span class="service-title">Sistema Web (CRUD)</span>
                    <span class="service-price">Aprox. R$ 1.500,00</span>
                </label>
            </div>
        </div>

        <!-- Detalhes Adicionais -->
        <div class="form-group">
            <label for="clientNotes"><i class="fas fa-comment-alt"></i> Observações ou Detalhes do Aparelho/Projeto:</label>
            <textarea id="clientNotes" class="form-control" rows="3" placeholder="Ex: Meu notebook é um Dell e está a desligar sozinho..."></textarea>
        </div>

        <!-- Resumo do Orçamento -->
        <div class="budget-summary">
            <div class="summary-text">
                <h3>Estimativa Inicial</h3>
                <p>O valor final poderá ser confirmado após avaliação técnica.</p>
            </div>
            <div class="total-value" id="totalDisplay">R$ 0,00</div>
        </div>

        <!-- Botão Enviar WhatsApp -->
        <button type="button" class="btn-submit" onclick="enviarWhatsApp()">
            <i class="fab fa-whatsapp" style="font-size: 1.3rem;"></i> Enviar Orçamento via WhatsApp
        </button>
    </form>

    <div style="text-align: center;">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao site principal</a>
    </div>
</div>

<script>
// Alternar categorias de serviços visíveis
function toggleCategory() {
    const category = document.getElementById('serviceCategory').value;
    const groupManutencao = document.getElementById('groupManutencao');
    const groupWeb = document.getElementById('groupWeb');

    // Desmarcar todas as caixas ao trocar de categoria
    document.querySelectorAll('input[name="servico"]').forEach(cb => cb.checked = false);
    document.querySelectorAll('.service-card-checkbox').forEach(card => card.classList.remove('selected'));

    if (category === 'manutencao') {
        groupManutencao.style.display = 'block';
        groupWeb.style.display = 'none';
    } else {
        groupManutencao.style.display = 'none';
        groupWeb.style.display = 'block';
    }
    calcTotal();
}

// Destacar cartões selecionados e calcular total
function calcTotal() {
    let total = 0;
    document.querySelectorAll('input[name="servico"]').forEach(cb => {
        const card = cb.closest('.service-card-checkbox');
        if (cb.checked) {
            card.classList.add('selected');
            total += parseFloat(cb.getAttribute('data-price'));
        } else {
            card.classList.remove('selected');
        }
    });

    document.getElementById('totalDisplay').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
}

// Enviar mensagem formatada para o WhatsApp
function enviarWhatsApp() {
    const name = document.getElementById('clientName').value.trim();
    if (!name) {
        alert('Por favor, digite o seu nome antes de enviar o orçamento.');
        document.getElementById('clientName').focus();
        return;
    }

    const category = document.getElementById('serviceCategory').value;
    const notes = document.getElementById('clientNotes').value.trim();
    
    let servicosSelecionados = [];
    let total = 0;

    document.querySelectorAll('input[name="servico"]').forEach(cb => {
        if (cb.checked) {
            servicosSelecionados.push(`- ${cb.value} (R$ ${parseFloat(cb.getAttribute('data-price')).toFixed(2).replace('.', ',')})`);
            total += parseFloat(cb.getAttribute('data-price'));
        }
    });

    if (servicosSelecionados.length === 0) {
        alert('Selecione pelo menos um serviço para gerar o orçamento.');
        return;
    }

    const categoriaTexto = category === 'manutencao' ? 'Manutenção de Computadores' : 'Desenvolvimento Web';

    let mensagem = `*Solicitação de Orçamento - RAMONINFTEC* 🚀\n\n`;
    mensagem += `👤 *Nome:* ${name}\n`;
    mensagem += `📂 *Categoria:* ${categoriaTexto}\n\n`;
    mensagem += `🛠️ *Serviços Selecionados:*\n${servicosSelecionados.join('\n')}\n\n`;
    if (notes) {
        mensagem += `💬 *Observações:* ${notes}\n\n`;
    }
    mensagem += `💰 *Valor Estimado:* R$ ${total.toFixed(2).replace('.', ',')}\n\n`;
    mensagem += `*(Aguardando validação e confirmação técnica)*`;

    const telefoneRamon = '5531983184728';
    const urlWhatsApp = `https://wa.me/${telefoneRamon}?text=${encodeURIComponent(mensagem)}`;

    window.open(urlWhatsApp, '_blank');
}
</script>

</body>
</html>
